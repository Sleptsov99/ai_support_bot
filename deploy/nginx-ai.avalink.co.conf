# /etc/nginx/sites-available/ai.avalink.co
# HTTPS is added by certbot (certbot --nginx -d ai.avalink.co), it edits this file itself.

# Each request to the bot costs LLM tokens: at most 30 messages a minute per IP.
limit_req_zone $binary_remote_addr zone=bot_api:10m rate=30r/m;

server {
    listen 80;
    server_name ai.avalink.co;

    # Demo is closed with a password: the DeepSeek key behind it costs money.
    auth_basic "AI support bot";
    auth_basic_user_file /etc/nginx/.htpasswd-ai;

    client_max_body_size 2m;

    location /demo/api/ {
        limit_req zone=bot_api burst=10 nodelay;
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/snippets/ai-bot-proxy.conf;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/snippets/ai-bot-proxy.conf;
    }

    location = /health {
        auth_basic off;
        proxy_pass http://127.0.0.1:8000;
    }

    # Consultant webhook (when the bot is connected to the real chat): no password, the secret is in the URL.
    # location /webhook/ {
    #     auth_basic off;
    #     proxy_pass http://127.0.0.1:8000;
    #     include /etc/nginx/snippets/ai-bot-proxy.conf;
    # }
}
