<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Support Bot · демо</title>
<style>
  :root {
    --bg: #eef1f6; --panel: #ffffff; --ink: #1b2330; --muted: #6b7686; --line: #e2e7ef;
    --brand: #1f6feb; --brand-ink: #ffffff; --bot: #f2f5fa; --user: #1f6feb; --user-ink: #fff;
    --note-bg: #fff8e1; --note-line: #f2c94c; --ok: #1a7f37; --warn: #b54708; --sys: #8a94a6;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: var(--ink); background: var(--bg); }
  .wrap { display: grid; grid-template-columns: 420px 1fr; gap: 20px; max-width: 1200px; margin: 0 auto; padding: 20px; height: 100vh; }
  @media (max-width: 900px) { .wrap { grid-template-columns: 1fr; height: auto; } }

  /* chat widget */
  .widget { background: var(--panel); border-radius: 16px; box-shadow: 0 8px 30px rgba(20,30,60,.12); display: flex; flex-direction: column; overflow: hidden; min-height: 600px; }
  .w-head { background: #0f1b2d; color: #fff; padding: 14px 16px; display: flex; align-items: center; gap: 10px; }
  .w-head .ava { width: 34px; height: 34px; border-radius: 50%; background: var(--brand); display: grid; place-items: center; font-weight: 700; }
  .w-head .t { font-weight: 600; } .w-head .s { font-size: 12px; opacity: .7; }
  .msgs { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .row { display: flex; flex-direction: column; max-width: 85%; }
  .row.bot { align-self: flex-start; } .row.user { align-self: flex-end; align-items: flex-end; }
  .bubble { padding: 9px 12px; border-radius: 14px; white-space: pre-wrap; word-wrap: break-word; }
  .bot .bubble { background: var(--bot); border-bottom-left-radius: 4px; }
  .user .bubble { background: var(--user); color: var(--user-ink); border-bottom-right-radius: 4px; }
  .opts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .opts button { border: 1px solid var(--brand); color: var(--brand); background: #fff; border-radius: 999px; padding: 5px 11px; font-size: 13px; cursor: pointer; }
  .opts.rows { flex-direction: column; } .opts.rows button { border-radius: 8px; text-align: left; }
  .opts button:hover { background: var(--brand); color: #fff; }
  .opts button:disabled { opacity: .45; cursor: default; background: #fff; color: var(--brand); }
  .meta { font-size: 11px; color: var(--muted); margin-top: 3px; }
  .sys { align-self: center; font-size: 12px; color: var(--sys); background: #f5f7fa; border-radius: 999px; padding: 3px 10px; }
  .sys.handoff { color: var(--warn); background: #fff1e6; font-weight: 600; }
  .sys.resolved { color: var(--ok); background: #e9f7ee; font-weight: 600; }
  .note { align-self: stretch; background: var(--note-bg); border: 1px dashed var(--note-line); border-radius: 10px; padding: 8px 10px; font-size: 12px; white-space: pre-wrap; }
  .note b { display: block; margin-bottom: 4px; }
  .typing { align-self: flex-start; color: var(--muted); font-size: 12px; }
  .composer { display: flex; gap: 8px; padding: 12px; border-top: 1px solid var(--line); }
  .composer input { flex: 1; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font-size: 14px; }
  .composer button { border: 0; border-radius: 10px; padding: 0 14px; background: var(--brand); color: #fff; font-weight: 600; cursor: pointer; }
  .composer button.ghost { background: #f0f3f8; color: var(--ink); font-weight: 400; }
  .composer :disabled { opacity: .5; cursor: default; }

  /* engine panel */
  .side { display: flex; flex-direction: column; gap: 16px; min-height: 0; }
  .card { background: var(--panel); border-radius: 14px; padding: 14px 16px; box-shadow: 0 2px 10px rgba(20,30,60,.06); }
  .card h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 0 10px; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  label { font-size: 12px; color: var(--muted); display: flex; flex-direction: column; gap: 4px; }
  select { border: 1px solid var(--line); border-radius: 8px; padding: 7px; font-size: 13px; background: #fff; }
  .actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .actions button { border: 1px solid var(--line); background: #fff; border-radius: 8px; padding: 7px 12px; cursor: pointer; font-size: 13px; }
  .actions button.primary { background: var(--brand); color: #fff; border-color: var(--brand); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  td { padding: 5px 0; border-bottom: 1px solid var(--line); } td:first-child { color: var(--muted); width: 45%; }
  .log { flex: 1; min-height: 160px; overflow-y: auto; font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; }
  .log .item { border-bottom: 1px solid var(--line); padding: 6px 0; }
  .log .dir { font-weight: 700; } .log .in { color: #6f42c1; } .log .out { color: var(--brand); }
  .log pre { margin: 4px 0 0; white-space: pre-wrap; word-break: break-all; color: #3b4452; }
  .banner { font-size: 12px; color: var(--muted); }
  .pill { display: inline-block; padding: 1px 8px; border-radius: 999px; background: #eef3ff; color: var(--brand); font-weight: 600; }
</style>
</head>
<body>
<div class="wrap">
  <section class="widget">
    <div class="w-head"><div class="ava">A</div><div><div class="t">AvaBet Support</div><div class="s" id="headSub">AI Support Bot</div></div></div>
    <div class="msgs" id="msgs"></div>
    <form class="composer" id="composer">
      <button type="button" class="ghost" id="fileBtn" title="Отправить скриншот">📎</button>
      <input id="text" placeholder="Напишите сообщение…" autocomplete="off">
      <button id="sendBtn">➤</button>
    </form>
  </section>

  <section class="side">
    <div class="card">
      <h2>Данные клиента от платформы</h2>
      <div class="grid">
        <label>GEO
          <select id="geo">
            <option value="EG">Египет (EG)</option><option value="NG">Нигерия (NG)</option><option value="KE">Кения (KE)</option>
            <option value="KG">Кыргызстан (KG)</option><option value="TR">Турция (TR)</option><option value="AZ">Азербайджан (AZ)</option>
            <option value="SA">Сауд. Аравия (SA)</option><option value="AR">Аргентина (AR)</option><option value="ZA">ЮАР (ZA)</option>
            <option value="GH">Гана (GH)</option><option value="">не передано</option>
          </select></label>
        <label>Язык интерфейса
          <select id="lang"><option value="ar">ar</option><option value="en">en</option><option value="fr">fr</option><option value="es">es</option><option value="tr">tr</option><option value="az">az</option><option value="ky">ky</option><option value="sw">sw</option><option value="am">am</option><option value="ru">ru</option><option value="">не передан</option></select></label>
        <label>Устройство
          <select id="channel"><option>App_Android</option><option>WebMobi</option><option>Web</option><option>App_iOs</option></select></label>
      </div>
      <div class="actions">
        <button class="primary" id="newBtn">Новый чат (SetChat)</button>
        <button id="pingBtn">Ping → Pong</button>
        <button id="closeBtn">Закрыть по таймауту (UnsetChat)</button>
      </div>
    </div>

    <div class="card">
      <h2>Состояние движка</h2>
      <table id="state"><tr><td colspan="2" class="banner">Нажмите «Новый чат»</td></tr></table>
    </div>

    <div class="card" style="flex:1; display:flex; flex-direction:column; min-height:0">
      <h2>Обмен с Consultant (webhook ⇄ /messages)</h2>
      <div class="log" id="log"></div>
    </div>
  </section>
</div>

<script>
const $ = (id) => document.getElementById(id);
let chatId = null, locked = false;

const LABELS = { persona: "Персона", geo: "GEO", language: "Язык ответа", device: "Устройство", topic: "Тема",
  group: "Группа эскалации", signal: "Сигнал последнего сообщения", attempts: "Неудачных попыток по проблеме",
  issues: "Счетчики по проблемам", payment_wait_hours: "Ожидание платежа, ч", payment_details: "Собрано для L1",
  awaiting: "Ждем от клиента", escalation_reason: "Причина передачи", status: "Статус" };

async function api(path, body) {
  const r = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body || {}) });
  return r.json();
}
// Typical interface language for the country; the bot still answers in the language the client writes in.
const GEO_LANG = {EG:"ar", NG:"en", KE:"en", KG:"ky", TR:"tr", AZ:"az", SA:"ar", AR:"es", ZA:"en", GH:"en"};
function syncLang() { const l = GEO_LANG[$("geo").value]; if (l) $("lang").value = l; }
$("geo").addEventListener("change", syncLang); syncLang();
function client() { return { geo: $("geo").value || null, language: $("lang").value || null, channel: $("channel").value }; }

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function scroll() { const m = $("msgs"); m.scrollTop = m.scrollHeight; }
function add(node) { $("msgs").appendChild(node); scroll(); }

function setLocked(v) { locked = v; ["text", "sendBtn", "fileBtn"].forEach(id => $(id).disabled = v); }

function renderReaction(r) {
  switch (r.$type) {
    case "BotMessage": case "BotReplyMessage": {
      const row = el("div", "row bot");
      row.appendChild(el("div", "bubble", r.text || ""));
      const mk = r.replyMarkup || {};
      const opts = [...(mk.buttons || []), ...(mk.rows || [])];
      if (opts.length) {
        const box = el("div", "opts" + ((mk.rows || []).length ? " rows" : ""));
        opts.forEach(o => {
          const b = el("button", null, o.text);
          b.onclick = () => { if (!locked) { box.querySelectorAll("button").forEach(x => x.disabled = true); send({ text: o.text, variant_id: o.id }); } };
          box.appendChild(b);
        });
        row.appendChild(box);
      }
      if (r.$type === "BotReplyMessage" && r.result) row.appendChild(el("div", "meta", "result: " + r.result));
      add(row); break;
    }
    case "SupportBotMessage": {
      const n = el("div", "note"); n.appendChild(el("b", null, "🔒 Заметка для оператора L1 (клиент не видит)")); n.appendChild(document.createTextNode(r.text)); add(n); break;
    }
    case "InvokeOperator": add(el("div", "sys handoff", "➡️ Чат передан оператору L1")); setLocked(true); break;
    case "ResolveChat": add(el("div", "sys resolved", "✅ Вопрос решен, диалог закрыт")); setLocked(true); break;
    case "ChangeChatLanguage": add(el("div", "sys", "🌐 Язык чата → " + r.languageCode)); break;
    case "PongActivity": break;
  }
}

function log(dir, obj) {
  const it = el("div", "item");
  const head = el("div", "dir " + (dir === "in" ? "in" : "out"), dir === "in" ? "→ webhook: " + obj.$type : "← POST /messages: " + obj.$type);
  it.appendChild(head); it.appendChild(el("pre", null, JSON.stringify(obj, null, 1)));
  $("log").appendChild(it); $("log").scrollTop = $("log").scrollHeight;
}

function renderState(s) {
  const t = $("state"); t.innerHTML = "";
  if (!s) { t.innerHTML = '<tr><td colspan="2" class="banner">Диалог завершен</td></tr>'; return; }
  for (const [k, label] of Object.entries(LABELS)) {
    const v = s[k];
    const tr = el("tr"); tr.appendChild(el("td", null, label));
    const td = el("td"); td.appendChild(el("span", k === "persona" || k === "status" ? "pill" : null, v == null ? "—" : String(v)));
    tr.appendChild(td); t.appendChild(tr);
  }
  $("headSub").textContent = s.persona ? "Оператор: " + s.persona.split(" (")[0] : "AI Support Bot";
}

function handle(res) {
  log("in", res.event);
  res.reactions.forEach(r => { log("out", r); renderReaction(r); });
  if (res.state !== undefined) renderState(res.state);
}

async function send(payload) {
  if (!chatId || locked) return;
  if (payload.text || payload.with_file) {
    const row = el("div", "row user");
    row.appendChild(el("div", "bubble", payload.with_file ? "📎 screenshot.jpg" + (payload.text ? "\n" + payload.text : "") : payload.text));
    add(row);
  }
  const typing = el("div", "typing", "печатает…"); add(typing);
  const res = await api("/demo/api/message", { chat_id: chatId, ...client(), ...payload });
  await new Promise(r => setTimeout(r, 350));
  typing.remove(); handle(res);
}

$("composer").onsubmit = (e) => { e.preventDefault(); const t = $("text").value.trim(); if (!t) return; $("text").value = ""; send({ text: t }); };
$("fileBtn").onclick = () => send({ with_file: true });
$("newBtn").onclick = async () => {
  $("msgs").innerHTML = ""; $("log").innerHTML = ""; setLocked(false);
  const res = await api("/demo/api/new", client()); chatId = res.chat_id; handle(res); $("text").focus();
};
$("pingBtn").onclick = async () => { const res = await api("/demo/api/ping"); log("in", res.event); res.reactions.forEach(r => log("out", r)); };
$("closeBtn").onclick = async () => {
  if (!chatId) return; const res = await api("/demo/api/close", { chat_id: chatId });
  handle(res); add(el("div", "sys", "⏱ Чат закрыт платформой (Timeout)")); setLocked(true);
};
$("newBtn").click();
</script>
</body>
</html>
