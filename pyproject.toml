[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-support-bot"
version = "0.1.0"
description = "AI Support Bot engine (AvaBet / Uplatform, Consultant integration) - first rough version"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "httpx>=0.27",
    "pydantic>=2.6",
    "uvicorn>=0.29",
    "anthropic>=2.10",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "openpyxl>=3.1"]

[tool.setuptools.packages.find]
include = ["support_bot*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.setuptools.package-data]
support_bot = ["*.html", "data/*.json", "data/*.md", "demo/*.html", "demo/*.json"]
